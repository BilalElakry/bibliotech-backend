server:
  port: 8080

spring:
  application:
    name: bibliotech

  datasource:
    url: jdbc:mysql://localhost:3306/bibliotech_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:3b
          temperature: 0.7
      # NEW: embedding model via Ollama (free, local)
      embedding:
        options:
          model: nomic-embed-text
    # NEW: Qdrant Cloud vector store
    vectorstore:
      qdrant:
        host: 0fd6fa2b-f39e-4120-aeb0-b909219299a5.europe-west6-0.gcp.cloud.qdrant.io        # e.g. abc123.eu-central.aws.cloud.qdrant.io
        port: 6334                  # Qdrant Cloud gRPC port (always 6334)
        api-key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2Nlc3MiOiJtIiwic3ViamVjdCI6ImFwaS1rZXk6MGEzZTZkMWYtYTFhZC00NDkyLWE1NTgtMjdmNWJiMTdlM2U3In0.5nV7CbYmIvMti8EgIvtGDhdSvUW9w7M0lIkTb-3Tyt8
        collection-name: bibliotech-rag
        use-tls: true               # required for Qdrant Cloud
        initialize-schema: true     # auto-creates collection on first startup

  mail:
    host: smtp.gmail.com
    port: 587
    username: bibliotech.notifications@gmail.com
    password: ssjh lwon xmyg qqfe
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

bibliotech:
  jwt:
    secret: bibliotech-jwt-secret-key-2026-bilal-haitam-emsi-rabat
    expiration: 86400000
  mail:
    enabled: false
    from: bibliotech.notifications@gmail.com
    app-name: BiblioTech
  storage:
    upload-dir: ./uploads
  tts:
    max-chars: 3000
    max-pages: 10
    engine: espeak  # ou "marytts"
  rag:
    enabled: true
    chunk-size: 500       # tokens per chunk
    chunk-overlap: 50     # overlap between consecutive chunks
    top-k: 5              # chunks retrieved per query
    min-score: 0.50       # minimum cosine similarity (0.0 - 1.0)