server:
  port: 8080
  tomcat:
    connection-timeout: 300000
spring:
  application:
    name: bibliotech

  datasource:
    url: jdbc:mysql://localhost:3306/bibliotech_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:3b
          temperature: 0.0         # 0.0 au lieu de 0.1 pour éliminer toute hésitation mathématique du modèle
          top-k: 10
          top-p: 0.5
          num-ctx: 4096            # OPTIMISÉ CPU : Réduit à 4096 pour diviser par deux le temps de calcul du contexte
          num-predict: 256         # OPTIMISÉ CPU : Réduit à 256. Le chatbot n'a pas besoin d'écrire un roman en soutenance.
          keep-alive: "24h"      # Maintient le modèle en mémoire VRAM
      embedding:
        options:
          model: nomic-embed-text

    # OPTIMISÉ : Clés masquées via variables d'environnement pour éviter les fuites sur GitHub
    vectorstore:
      qdrant:
        host: ff732f6a-619e-4eac-ad4d-7fcd04f861c2.eu-west-2-0.aws.cloud.qdrant.io
        port: 6334
        api-key: ${QDRANT_API_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2Nlc3MiOiJtIiwic3ViamVjdCI6ImFwaS1rZXk6ZDg2YmJlMzItNmUyNS00MTczLWJkNTgtODc0OTk1ZjMxZDRiIn0.RR9hsSxSSBl8JXwE6anVwHQB1f5ttu8VgLnwLuF6igQ}
        collection-name: bibliotech-rag
        use-tls: true
        initialize-schema: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: bibliotech.notifications@gmail.com
    password: ssjh lwon xmyg qqfe
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

